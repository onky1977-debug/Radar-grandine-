<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radar Grandine & Allerta Meteo</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-blue: #3b82f6;
            --accent-green: #10b981;
            --accent-yellow: #f59e0b;
            --accent-orange: #f97316;
            --accent-red: #ef4444;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); padding: 16px; min-height: 100vh; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 16px; }
        header { text-align: center; padding: 12px 0; border-bottom: 1px solid var(--border-color); }
        header h1 { font-size: 1.3rem; color: var(--text-main); display: flex; align-items: center; justify-content: center; gap: 8px; }
        header p { font-size: 0.85rem; color: var(--text-muted); margin-top: 4px; }
        
        .card { background-color: var(--card-bg); border-radius: 12px; padding: 16px; border: 1px solid var(--border-color); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        .card-title { font-size: 0.9rem; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-muted); margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        
        .btn { width: 100%; background: linear-gradient(135deg, #2563eb, #3b82f6); color: white; border: none; padding: 12px; border-radius: 8px; font-size: 0.95rem; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: opacity 0.2s; }
        .btn-green { background: linear-gradient(135deg, #059669, #10b981); }
        .btn:active { opacity: 0.8; }
        
        .search-box { display: flex; gap: 8px; margin-bottom: 10px; }
        .search-box input { flex: 1; background: var(--bg-color); border: 1px solid var(--border-color); color: white; padding: 10px; border-radius: 8px; font-size: 0.95rem; }
        .search-box button { width: auto; padding: 0 16px; }

        .status-badge { text-align: center; padding: 14px; border-radius: 10px; font-weight: bold; font-size: 1.1rem; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 1px; }
        .score-val { font-size: 2rem; font-weight: 800; display: block; margin-top: 2px; }
        
        .metric-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--border-color); font-size: 0.9rem; }
        .metric-row:last-child { border-bottom: none; }
        .metric-label { color: var(--text-muted); }
        .metric-value { font-weight: 600; text-align: right; }

        .comparison-list { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
        .comp-item { background: var(--bg-color); padding: 10px; border-radius: 8px; border: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; font-size: 0.9rem; }
        .comp-score { font-weight: bold; padding: 4px 8px; border-radius: 6px; }

        .loading { text-align: center; color: var(--text-muted); padding: 15px; font-style: italic; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🛡️ Radar Grandine</h1>
            <p>Valutazione Rischio Temporali & Grandinacei</p>
        </header>

        <!-- Sezione Posizione e Ricerca -->
        <div class="card">
            <div class="card-title">Seleziona Posizione</div>
            <div class="search-box">
                <input type="text" id="locationSearch" placeholder="Es. Casalgrande, Sassuolo, Reggio Emilia..." value="Casalgrande">
                <button class="btn" onclick="searchLocation()">🔍 Cerca</button>
            </div>
            <button class="btn btn-green" onclick="fetchGPS()">📍 Usa Posizione GPS</button>
        </div>

        <!-- Risultato Analisi -->
        <div class="card">
            <div class="card-title"><span id="locationTitle">Rischio per: Casalgrande</span></div>
            <div id="statusBadge" class="status-badge" style="background: #334155; color: #94a3b8;">
                Analisi in corso... <span id="scoreVal" class="score_val">--%</span>
            </div>
            
            <div id="metricsList">
                <div class="loading">Caricamento modelli atmosferici...</div>
            </div>
        </div>

        <!-- Scansione Zone Limitrofe -->
        <div class="card">
            <div class="card-title">📡 Radar Zone Limitrofe</div>
            <p style="font-size:0.8rem; color:var(--text-muted); margin-bottom:8px;">Verifica la situazione nei comuni e nelle vallate adiacenti:</p>
            <button class="btn" onclick="scanNearby()">🔍 Scansiona Zone Vicine</button>
            <div id="nearbyResults" class="comparison-list" style="margin-top:10px;"></div>
        </div>
    </div>

    <script>
        let currentLat = 44.5894;
        let currentLon = 10.7383;
        let currentPlaceName = "Casalgrande (RE)";

        window.onload = function() {
            runAnalysis(currentLat, currentLon, currentPlaceName);
        };

        async function searchLocation() {
            const query = document.getElementById('locationSearch').value.trim();
            if (!query) return;

            const metricsDiv = document.getElementById('metricsList');
            metricsDiv.innerHTML = `<div class="loading">Cerco "${query}"...</div>`;

            try {
                const geoUrl = `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(query)}&count=1&language=it&format=json`;
                const res = await fetch(geoUrl);
                const data = await res.json();

                if (!data.results || data.results.length === 0) {
                    alert("Località non trovata.");
                    metricsDiv.innerHTML = '<div class="loading" style="color:var(--accent-red);">Località non trovata.</div>';
                    return;
                }

                const place = data.results[0];
                currentLat = place.latitude;
                currentLon = place.longitude;
                currentPlaceName = `${place.name} (${place.admin1 || ''})`;

                document.getElementById('locationTitle').innerText = `Rischio per: ${currentPlaceName}`;
                runAnalysis(currentLat, currentLon, currentPlaceName);

            } catch (err) {
                alert("Errore nella ricerca.");
            }
        }

        function fetchGPS() {
            if (!navigator.geolocation) {
                alert("Geolocalizzazione non supportata.");
                return;
            }
            document.getElementById('metricsList').innerHTML = '<div class="loading">Rilevamento GPS in corso...</div>';
            navigator.geolocation.getCurrentPosition(position => {
                currentLat = position.coords.latitude;
                currentLon = position.coords.longitude;
                currentPlaceName = "Posizione Attuale (GPS)";
                document.getElementById('locationTitle').innerText = `Rischio per: ${currentPlaceName}`;
                runAnalysis(currentLat, currentLon, currentPlaceName);
            }, error => {
                alert("Impossibile rilevare la posizione GPS.");
            }, { timeout: 10000 });
        }

        async function runAnalysis(lat, lon, placeName) {
            const metricsDiv = document.getElementById('metricsList');
            const badge = document.getElementById('statusBadge');

            metricsDiv.innerHTML = '<div class="loading">Analisi indici instabilità (CAPE, Zero Termico, Wind Shear)...</div>';

            const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=cape,freezing_level_height,wind_speed_10m&hourly=cape,freezing_level_height,wind_speed_10m&timezone=auto`;

            try {
                const response = await fetch(url);
                const data = await response.json();

                const current = data.current || {};
                const cape = current.cape || 0;
                const freezingLevel = current.freezing_level_height || 3000;
                const windSpeed = current.wind_speed_10m || 0;

                // Calcolo Rischio Grandine (0 - 100%)
                let capeScore = 0;
                if (cape > 2500) capeScore = 100;
                else if (cape > 1500) capeScore = 85;
                else if (cape > 800) capeScore = 60;
                else if (cape > 300) capeScore = 30;

                let zeroScore = 0;
                if (freezingLevel >= 2800 && freezingLevel <= 4200) zeroScore = 100;
                else if (freezingLevel > 2000 && freezingLevel < 2800) zeroScore = 60;
                else zeroScore = 20;

                let windScore = windSpeed > 25 ? 100 : (windSpeed > 15 ? 60 : 20);

                let totalScore = Math.round((capeScore * 0.55) + (zeroScore * 0.30) + (windScore * 0.15));
                totalScore = Math.max(0, Math.min(100, totalScore));

                let badgeText = "";
                let badgeColor = "";
                if (totalScore < 25) {
                    badgeText = "🟢 Rischio Basso / Nullo";
                    badgeColor = "var(--accent-green)";
                } else if (totalScore < 45) {
                    badgeText = "🟡 Attenzione: Temporali";
                    badgeColor = "var(--accent-yellow)";
                } else if (totalScore < 70) {
                    badgeText = "🟠 Allerta Grandine Moderata";
                    badgeColor = "var(--accent-orange)";
                } else {
                    badgeText = "🔴 ALLERTA GRANDINE ELEVATA";
                    badgeColor = "var(--accent-red)";
                }

                badge.style.background = badgeColor;
                badge.style.color = "#ffffff";
                badge.innerHTML = `${badgeText} <span class="score-val">${totalScore}%</span>`;

                metricsList.innerHTML = `
                    <div class="metric-row">
                        <span class="metric-label">Energia CAPE (Instabilità):</span>
                        <span class="metric-value">${Math.round(cape)} J/kg</span>
                    </div>
                    <div class="metric-row">
                        <span class="metric-label">Quota Zero Termico:</span>
                        <span class="metric-value">${Math.round(freezingLevel)} m</span>
                    </div>
                    <div class="metric-row">
                        <span class="metric-label">Vento al Suolo:</span>
                        <span class="metric-value">${Math.round(windSpeed)} km/h</span>
                    </div>
                `;

            } catch (err) {
                metricsList.innerHTML = '<div class="loading" style="color:var(--accent-red);">Errore recupero dati meteo.</div>';
            }
        }

        async function scanNearby() {
            const resultsDiv = document.getElementById('nearbyResults');
            resultsDiv.innerHTML = '<div class="loading">Scansione in corso delle zone e dei comuni vicini...</div>';

            // Generiamo punti geografici nello raggio di 15-20km dalla posizione corrente
            const offsets = [
                { name: "Zona Nord (+15km)", dLat: 0.12, dLon: 0 },
                { name: "Zona Sud / Collina (+15km)", dLat: -0.12, dLon: 0 },
                { name: "Zona Est (+15km)", dLat: 0, dLon: 0.15 },
                { name: "Zona Ovest (+15km)", dLat: 0, dLon: -0.15 }
            ];

            let htmlOutput = "";
            let highestRiskZone = "";
            let maxRisk = -1;

            for (let off of offsets) {
                const targetLat = currentLat + off.dLat;
                const targetLon = currentLon + off.dLon;

                try {
                    const url = `https://api.open-meteo.com/v1/forecast?latitude=${targetLat}&longitude=${targetLon}&current=cape,freezing_level_height,wind_speed_10m&timezone=auto`;
                    const res = await fetch(url);
                    const data = await res.json();
                    const current = data.current || {};
                    const cape = current.cape || 0;
                    const freezingLevel = current.freezing_level_height || 3000;
                    const windSpeed = current.wind_speed_10m || 0;

                    let capeScore = cape > 2500 ? 100 : (cape > 1500 ? 85 : (cape > 800 ? 60 : (cape > 300 ? 30 : 0)));
                    let zeroScore = (freezingLevel >= 2800 && freezingLevel <= 4200) ? 100 : 40;
                    let windScore = windSpeed > 25 ? 100 : (windSpeed > 15 ? 60 : 20);

                    let score = Math.round((capeScore * 0.55) + (zeroScore * 0.30) + (windScore * 0.15));

                    if (score > maxRisk) {
                        maxRisk = score;
                        highestRiskZone = off.name;
                    }

                    let colorBg = score >= 70 ? 'var(--accent-red)' : (score >= 45 ? 'var(--accent-orange)' : (score >= 25 ? 'var(--accent-yellow)' : 'var(--accent-green)'));

                    htmlOutput += `
                        <div class="comp-item" onclick="loadSearchedCoords(${targetLat}, ${targetLon}, '${off.name}')" style="cursor:pointer;">
                            <span>📍 <strong>${off.name}</strong></span>
                            <span class="comp-score" style="background:${colorBg}; color:white;">Rischio ${score}%</span>
                        </div>
                    `;
                } catch (e) {}
            }

            let alertHeader = maxRisk >= 50 
                ? `<div style="font-size:0.85rem; color:var(--accent-red); margin-bottom:6px; font-weight:bold;">⚠️ ATTENZIONE: Rischio più alto rilevato in ${highestRiskZone} (${maxRisk}%)</div>`
                : `<div style="font-size:0.85rem; color:var(--accent-green); margin-bottom:6px; font-weight:bold;">✅ Rischio contenuto in tutte le zone limitrofe</div>`;

            resultsDiv.innerHTML = `
                ${alertHeader}
                ${htmlOutput}
                <div style="font-size:0.75rem; color:var(--text-muted); margin-top:4px; text-align:center;">Tocca un punto per analizzarne i dettagli.</div>
            `;
        }

        function loadSearchedCoords(lat, lon, name) {
            currentLat = lat;
            currentLon = lon;
            currentPlaceName = name;
            document.getElementById('locationTitle').innerText = `Rischio per: ${name}`;
            runAnalysis(lat, lon, name);
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    </script>
</body>
</html>
